spring:
  application:
    name: task-tracker
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    web:
      pageable:
        max-page-size: 100
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    # Comma-separated allow-list. Never "*".
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

---
# Local development: file-based H2 in ./data (git-ignored). No credentials involved.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/task-tracker;MODE=PostgreSQL;AUTO_SERVER=FALSE
    username: sa
    password: ""

---
# Production: everything from environment variables.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
