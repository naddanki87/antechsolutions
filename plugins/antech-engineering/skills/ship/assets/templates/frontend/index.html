<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PRODUCT_NAME__</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>__PRODUCT_NAME__</h1>
  </header>

  <main class="wrap">
    <section aria-labelledby="form-title" class="card">
      <h2 id="form-title">Add item</h2>
      <form id="item-form" novalidate>
        <label for="title">Title</label>
        <input id="title" name="title" required maxlength="120" autocomplete="off">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" maxlength="1000" rows="3"></textarea>
        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit">Save</button>
      </form>
    </section>

    <section aria-labelledby="list-title" class="card">
      <h2 id="list-title">Items</h2>
      <p id="status" class="muted" aria-live="polite">Loading…</p>
      <ul id="items" class="list"></ul>
    </section>
  </main>
</body>
</html>
