// android/app/build.gradle
plugins {
    id 'com.android.application'
}

def keystoreFile = System.getenv('ANTECH_KEYSTORE_FILE')

android {
    namespace '__APP_ID__'
    compileSdk 35

    defaultConfig {
        applicationId '__APP_ID__'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        // Release talks to HTTPS only (see network_security_config). Replace with the real API host.
        buildConfigField 'String', 'DEFAULT_API_BASE', '"https://api.example.com"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANTECH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANTECH_KEY_ALIAS')
                keyPassword System.getenv('ANTECH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Emulator -> host machine running the Spring Boot backend.
            buildConfigField 'String', 'DEFAULT_API_BASE', '"http://10.0.2.2:8080"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for local unit tests (android.jar's version is a stub there).
    testImplementation 'org.json:json:20240303'
}
