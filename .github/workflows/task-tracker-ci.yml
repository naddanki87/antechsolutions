# .github/workflows/task-tracker-ci.yml
# Replace: task-tracker (e.g. leave-management), projects/task-tracker ("." for a dedicated repo, "projects/task-tracker" in antechsolutions),
#          task-tracker-v* ("v*" for a dedicated repo, "task-tracker-v*" in antechsolutions).
name: task-tracker CI

on:
  push:
    branches: [main, 'feat/**']
    tags: ['task-tracker-v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/task-tracker/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package executable JAR
        run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: projects/task-tracker/backend/target/*.jar
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/task-tracker/android
    env:
      ANTECH_KEYSTORE_BASE64: ${{ secrets.ANTECH_KEYSTORE_BASE64 }}
      ANTECH_KEYSTORE_PASSWORD: ${{ secrets.ANTECH_KEYSTORE_PASSWORD }}
      ANTECH_KEY_ALIAS: ${{ secrets.ANTECH_KEY_ALIAS }}
      ANTECH_KEY_PASSWORD: ${{ secrets.ANTECH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed 'tools' package, which fails.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode release keystore
        if: env.ANTECH_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANTECH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANTECH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and APK
        run: |
          GRADLE=gradle; [ -f gradlew ] && chmod +x gradlew && GRADLE=./gradlew
          $GRADLE --no-daemon testDebugUnitTest
          mkdir -p out
          if [ -n "$ANTECH_KEYSTORE_FILE" ]; then
            $GRADLE --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/app.apk
          else
            $GRADLE --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: projects/task-tracker/android/out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name artifacts and attach to the release
        run: |
          VERSION="${TAG##*v}"
          mkdir -p upload
          JAR=$(ls artifacts/jar/*.jar | grep -v -- '-plain.jar' | head -1)
          cp "$JAR" "upload/task-tracker-$VERSION.jar"
          for apk in artifacts/apk/*.apk; do
            case "$apk" in
              *-debug.apk) cp "$apk" "upload/task-tracker-$VERSION-debug.apk" ;;
              *)           cp "$apk" "upload/task-tracker-$VERSION.apk" ;;
            esac
          done
          (cd upload && sha256sum * > SHA256SUMS.txt)
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "task-tracker $TAG" --generate-notes
          gh release upload "$TAG" upload/* --repo "$REPO" --clobber
